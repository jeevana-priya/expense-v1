- name: create instances
  hosts: local
  connection: local
  vars:
    instances: ["mysql","backend","frontend"]
    image_id: ami-0220d79f3f480ecf5
    vpc_subnet_id: subnet-0bcdf0124041a31dc
    domain_name: matamma.online
    action: create
  tasks:
  - name: create ec2 instances
    amazon.aws.ec2_instance:
      name: "expense-{{ item }}"
      vpc_subnet_id: "{{ vpc_subnet_id}}"
      instance_type: t3.micro
      security_group: expense
      image_id: "{{image_id}}"
    loop: "{{ instances }}"
    register: ec2_output
    when: action == "create"

  - name: create r53 record
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name}}"
      record: "{{ item }}.{{ domin_name }}"
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address}}"
      overwrite: true 
    loop: "{{ ec2_output.results }}"
    when: action == "create"
  - name: create r53 record for frontend
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ domain_name }}" #daws90s.shop
      type: A
      ttl: 1
      value: "{{ item.instances[0].public_ip_address }}"
      overwrite: true
    loop: "{{ ec2_output.results }}"
    when: 
    - item.item == "frontend" 
    - action == "create"

  
  - name: delete r53 records
    amazon.aws.route53:
      state: absent
      zone: "{{ domain_name }}"
      record: "{{ item }}.{{ domain_name }}" # mongodb.daws90s.shop
      ttl: 1
      type: A
    loop: "{{ instances  }}"  
    when: action == "delete"
  - name: delete r53 record for frontend
    amazon.aws.route53:
      state: absent
      zone: "{{ domain_name }}"
      record: "{{ domain_name }}" # daws90s.shop
      ttl: 1
      type: A
    loop: "{{ instances  }}"  
    when: 
    - action == "delete"
    - item == "frontend"

  - name: delete instance
    amazon.aws.ec2_instance:
      name: "expense-{{ item }}"
      vpc_subnet_id: "{{ vpc_subnet_id}}"
      state: terminate
      wait: false
    loop: "{{ instances }}"
    when: action == "delete"
  





