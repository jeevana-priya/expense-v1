- name: configure mysql server
  hosts: mysql
  become: yes
  tasks:
  - name: install mysql
    package:
      name: mysql-server
      state: present
  - name: install mysql client
    package:
      name: mysql
      state: present
  - name: enable and start mysqld
    service:
      name: mysqld
      state: started
      enabled: yes
    
  - name: setting root MYSQL_PASSWORD
    command: mysql_secure_installation --set-root-pass ExpenseApp@1


    

    