- name: configure mysql server
  hosts: mysql
  become: yes
  tasks:
  - name: install mysql
    package:
      name: mysql-server
      state: present
  - name: install mysql client
    package:
      name: mysql
      state: present
    
  - name: setting root MYSQL_PASSWORD
    command: mysql_secure_installation --set-root-pass ExpenseApp@1
  # - name: load schema
  #   community.mysql.mysql_db:
  #     name: all
  #     state: import
  #     target: /app/schema/backend.sql
  #     login_host: "{{ MYSQL_HOST }}"
  #     login_user: root
  #     login_password: ExpenseApp@1
  - name: Load application schema
    shell: |
      mysql -h {{ MYSQL_HOST }} \
            -u root \
            -pExpenseApp@1 \
            < /app/schema/backend.sql

  - name: enable and start mysqld
    service:
      name: mysqld
      state: started
      enabled: yes
    

    